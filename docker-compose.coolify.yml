services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      DATABASE_URL: postgres://mestakip:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/mestakip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
      DIA_SERVER_CODE: ${DIA_SERVER_CODE:?}
      DIA_USERNAME: ${DIA_USERNAME:?}
      DIA_PASSWORD: ${DIA_PASSWORD:?}
      DIA_FIRMA_KODU: ${DIA_FIRMA_KODU:?}
      DIA_DONEM_KODU: ${DIA_DONEM_KODU:?}
      DIA_LOG_API_REQUESTS: ${DIA_LOG_API_REQUESTS:-True}
      DIA_SYNC_INTERVAL_MINUTES: ${DIA_SYNC_INTERVAL_MINUTES:-5}
      DIA_CARI_SYNC_INTERVAL_MINUTES: ${DIA_CARI_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_SYNC_INTERVAL_MINUTES: ${DIA_STOK_SYNC_INTERVAL_MINUTES:-5}
      DIA_FATURA_SYNC_INTERVAL_MINUTES: ${DIA_FATURA_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES: ${DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES:-5}
      RUN_CELERY_IN_WEB: ${RUN_CELERY_IN_WEB:-False}
      CREATE_SUPERUSER: ${CREATE_SUPERUSER:-False}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media-data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      DATABASE_URL: postgres://mestakip:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/mestakip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
      DIA_SERVER_CODE: ${DIA_SERVER_CODE:?}
      DIA_USERNAME: ${DIA_USERNAME:?}
      DIA_PASSWORD: ${DIA_PASSWORD:?}
      DIA_FIRMA_KODU: ${DIA_FIRMA_KODU:?}
      DIA_DONEM_KODU: ${DIA_DONEM_KODU:?}
      DIA_LOG_API_REQUESTS: ${DIA_LOG_API_REQUESTS:-True}
      DIA_SYNC_INTERVAL_MINUTES: ${DIA_SYNC_INTERVAL_MINUTES:-5}
      DIA_CARI_SYNC_INTERVAL_MINUTES: ${DIA_CARI_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_SYNC_INTERVAL_MINUTES: ${DIA_STOK_SYNC_INTERVAL_MINUTES:-5}
      DIA_FATURA_SYNC_INTERVAL_MINUTES: ${DIA_FATURA_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES: ${DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES:-5}
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media-data:/app/media
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: beat
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      DATABASE_URL: postgres://mestakip:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/mestakip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
      DIA_SERVER_CODE: ${DIA_SERVER_CODE:?}
      DIA_USERNAME: ${DIA_USERNAME:?}
      DIA_PASSWORD: ${DIA_PASSWORD:?}
      DIA_FIRMA_KODU: ${DIA_FIRMA_KODU:?}
      DIA_DONEM_KODU: ${DIA_DONEM_KODU:?}
      DIA_LOG_API_REQUESTS: ${DIA_LOG_API_REQUESTS:-True}
      DIA_SYNC_INTERVAL_MINUTES: ${DIA_SYNC_INTERVAL_MINUTES:-5}
      DIA_CARI_SYNC_INTERVAL_MINUTES: ${DIA_CARI_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_SYNC_INTERVAL_MINUTES: ${DIA_STOK_SYNC_INTERVAL_MINUTES:-5}
      DIA_FATURA_SYNC_INTERVAL_MINUTES: ${DIA_FATURA_SYNC_INTERVAL_MINUTES:-5}
      DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES: ${DIA_STOK_MIKTAR_SYNC_INTERVAL_MINUTES:-5}
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media-data:/app/media
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mestakip
      POSTGRES_USER: mestakip
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mestakip -d mestakip"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
