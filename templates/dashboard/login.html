<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MesDia - Sipariş Takip Sistemi">
    <meta name="keywords" content="sipariş, takip, lastik, envanter">
    <meta name="author" content="MesDia">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% load static %}{% static 'icons/favicon.png' %}?v=mesdia-1">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Title -->
    <title>Giriş Yap - MesDia</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% load static %}{% static 'main-DLfE7m78.css' %}">
    
    <style>
        body {
            --graphite: #25282d;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--graphite);
            background-image:
                linear-gradient(132deg, transparent 17%, rgba(208, 51, 66, .25) 17.1%, transparent 17.3%),
                linear-gradient(132deg, transparent 19%, rgba(255, 255, 255, .035) 19% 24%, transparent 24%),
                radial-gradient(ellipse at 80% 12%, #42474d, transparent 65%),
                linear-gradient(132deg, #25282d, #202226 72%);
        }

        .login-container {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
        }

        .login-card {
            width: min(100%, 400px);
            min-width: 0;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .15);
            background: #ebedef;
            box-shadow: 0 18px 56px rgba(0, 0, 0, .28);
            color: #202226;
        }

        .login-header {
            padding: 2rem;
            text-align: center;
            background: #e2e4e6;
            border-bottom: 1px solid #c9cccf;
            color: #202226;
        }

        .login-body {
            padding: 2rem;
        }
        
        .form-control {
            background: #ffffff;
            color: #2d3748;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background: #ffffff;
            color: #2d3748;
            border-color: #334155;
            box-shadow: 0 0 0 0.2rem rgba(51, 65, 85, 0.25);
        }
        
        .btn-login {
            background: var(--graphite);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(32, 34, 38, .18);
        }
        
        .input-group-text {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }
        
        .input-group .form-control {
            background: #ffffff;
            color: #2d3748;
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        
        .logo-container {
            margin-bottom: 1rem;
        }
        
        .logo-container img {
            width: 210px;
            max-width: 100%;
            height: auto;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Login Header -->
            <div class="login-header">
                <h1 class="logo-container">
                    <img src="{% static 'images/mesdia.png' %}" alt="MesDia">
                </h1>
                <p class="mb-0 opacity-75">Sipariş Takip Sistemi</p>
            </div>
            
            <!-- Login Body -->
            <div class="login-body">
                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            <i class="bi bi-{% if message.tags == 'success' %}check-circle{% else %}exclamation-triangle{% endif %} me-2"></i>
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <!-- Login Form -->
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">
                            <i class="bi bi-person me-1"></i>
                            Kullanıcı Adı
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" 
                                   class="form-control" 
                                   id="username" 
                                   name="username" 
                                   placeholder="Kullanıcı adınızı girin"
                                   required
                                   autocomplete="username">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock me-1"></i>
                            Şifre
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="password" 
                                   name="password" 
                                   placeholder="Şifrenizi girin"
                                   required
                                   autocomplete="current-password">
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Giriş Yap
                        </button>
                    </div>
                </form>
                
                <!-- Demo Credentials -->
                
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Auto focus on username field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
        
        // Form validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                e.preventDefault();
                alert('Lütfen tüm alanları doldurun!');
                return false;
            }
        });
    </script>
</body>
</html>
